---
# /app/config/services.yaml

- Media:
    - Immich:
        icon: immich.png
        href: http://192.168.1.176:2283
        description: Photo Backup & Management
        server: my-docker
        container: immich_server
        widget:
          type: immich
          url: http://immich_server:2283
          key: "{{HOMEPAGE_VAR_IMMICH_KEY}}" # Account Settings > API Keys
          version: 2 # Optional, but recommended for v2 server
    - Jellyseerr:
        icon: jellyseerr.png
        href: http://192.168.1.176:5055 # Replace with your Host IP
        description: Request Media
        server: my-docker
        container: jellyseerr
        widget:
          type: jellyseerr
          url: http://jellyseerr:5055
          key: "{{HOMEPAGE_VAR_JELLYSEERR_KEY}}" # Settings > General > API Key
    - Plex:
        icon: plex.png
        href: http://192.168.1.176:32400/web/index.html#!/
        description: Media Server
        server: my-docker
        container: plex
        widget:
          type: plex
          url: http://192.168.1.176:32400
          key: "{{HOMEPAGE_VAR_PLEX_TOKEN}}" # Find via https://support.plex.tv/articles/204059436-finding-an-authentication-token-x-plex-token/
    - Jellyfin:
        icon: jellyfin.png
        href: http://192.168.1.176:8096
        description: Media Server
        server: my-docker
        container: jellyfin
        widget:
          type: jellyfin
          url: http://192.168.1.176:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}" # Dashboard > API Keys
          enableBlocks: true # Shows active streams

- Automation:
    - Sonarr:
        icon: sonarr.png
        href: http://192.168.1.176:8989
        description: TV Shows
        server: my-docker
        container: sonarr
        widget:
          type: sonarr
          url: http://sonarr:8989
          key: "{{HOMEPAGE_VAR_SONARR_KEY}}" # Settings > General > API Key
    - Radarr:
        icon: radarr.png
        href: http://192.168.1.176:7878
        description: Movies
        server: my-docker
        container: radarr
        widget:
          type: radarr
          url: http://radarr:7878
          key: "{{HOMEPAGE_VAR_RADARR_KEY}}" # Settings > General > API Key
    - Prowlarr:
        icon: prowlarr.png
        href: http://192.168.1.176:9696
        description: Indexer Manager
        server: my-docker
        container: prowlarr
        widget:
          type: prowlarr
          url: http://prowlarr:9696
          key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"
    - Tautulli:
        icon: tautulli.png
        href: http://192.168.1.176:8181
        description: Plex Stats
        server: my-docker
        container: tautulli
        widget:
          type: tautulli
          url: http://192.168.1.176:8181
          key: "{{HOMEPAGE_VAR_TAUTULLI_KEY}}"
    - Notifiarr:
        icon: notifiarr.png
        href: http://192.168.1.176:5454
        description: Arr Notifications
        server: my-docker
        container: notifiarr
    - Tracearr:
        icon: mdi-chart-timeline-variant
        href: http://192.168.1.176:3333
        description: Arr Activity Tracker
        server: my-docker
        container: tracearr

- Downloads:
    - qBittorrent:
        icon: qbittorrent.png
        href: http://192.168.1.176:8080
        description: Downloader
        # qBittorrent runs inside gluetun's network, so the container status comes from gluetun
        server: my-docker
        container: gluetun
        widget:
          type: qbittorrent
          url: http://192.168.1.176:8080
          username: "{{HOMEPAGE_VAR_QBIT_USER}}"
          password: "{{HOMEPAGE_VAR_QBIT_PASS}}"

- Infrastructure:
    - Traefik:
        icon: traefik.png
        href: https://traefik.ts.paly-home.work # dashboard is only routed via Tailscale
        description: Reverse Proxy
        server: my-docker
        container: traefik
    - Speedtest:
        icon: speedtest-tracker.png
        href: http://192.168.1.176:8765
        description: Network Speed
        server: my-docker
        container: speedtest-tracker
        widget:
          type: speedtest
          url: http://192.168.1.176:8765
          # REQUIRED: You must generate an API key in the Speedtest Tracker UI (General > API Tokens)
          key: "{{HOMEPAGE_VAR_SPEEDTEST_KEY}}"
    - Gluetun VPN:
        icon: gluetun.png
        description: VPN Tunnel
        server: my-docker
        container: gluetun
        # This checks the public IP the VPN is currently using
        widget:
          type: gluetun
          url: http://gluetun:8000 # control server, via the qbit network (auth: qbit/auth/config.toml)
    - Labelarr:
        icon: plex.png
        description: Auto-Labeler
        # Points to the 'my-docker' entry defined in docker.yaml
        server: my-docker
        container: labelarr # Shows CPU/RAM for this specific container

- Cloud/Networking:
    - Tailscale Admin:
        icon: si-tailscale # Simple Icons for Tailscale
        href: https://login.tailscale.com/admin/machines
        description: Manage Tailnet VPN
    - Cloudflare Dashboard:
        icon: si-cloudflare # Simple Icons for Cloudflare
        href: https://dash.cloudflare.com/f7978bd2710da33adba360ba2aec4afd/paly-home.work/dns/records
        description: DNS & Proxy Management
    - Ugreen NAS UI:
        icon: si-server # Generic server icon
        href: http://192.168.1.105:9999/desktop/?os=ugospro#/
        description: NAS Administration Interface

- Gaming:
    - Crafty:
        icon: mdi-minecraft
        href: https://192.168.1.176:8443
        description: Minecraft Server Manager
        server: my-docker
        container: crafty_container

- Utilities:
    - Mealie:
        icon: mealie.png
        href: http://192.168.1.176:9925
        description: Recipe Manager
        server: my-docker
        container: mealie
    - Stirling-PDF:
        icon: si-stirlingpdf # Using Simple Icons for Stirling-PDF
        href: http://192.168.1.176:8282
        description: PDF Tools
        server: my-docker
        container: stirling-pdf
